---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so a persisted token is pure downside (zizmor: artipacked).
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Each mise task enters the devShell itself, so no outer `nix develop`.
      - run: mise run lint-all
        env:
          # Lets zizmor run its online audits rather than falling back to offline.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
