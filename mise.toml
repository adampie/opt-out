[settings]
# Records resolved versions, checksums and per-platform URLs in mise.lock
lockfile = true

[tools]
hk = "1.53.0"
markdownlint-cli2 = "0.23.2"
pkl = "0.32.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
zizmor = "1.28.0"

# nixfmt, statix and deadnix have no mise backend, so they come from the flake's
# devShell instead, pinned by flake.lock.

[tasks.flake-check]
description = "Validate the flake and all tool definitions"
run = "nix flake check"

# `nix flake check` leaves validateAll unchecked, and it is the only thing that
# validates the _-prefixed exclusions, which no module output references.
[tasks.validate-tools]
description = "Validate every tool definition, including _-prefixed exclusions"
run = "nix eval .#validateAll > /dev/null"

# nixfmt deprecated passing a directory, so feed it an explicit file list.
# git ls-files also matches what the flake itself sees.
[tasks.fmt]
description = "Format all Nix files"
run = '''nix develop -c bash -c "git ls-files '*.nix' | xargs nixfmt"'''

[tasks.fmt-check]
description = "Check all Nix files are formatted"
run = '''nix develop -c bash -c "git ls-files '*.nix' | xargs nixfmt --check"'''

[tasks.lint]
description = "Lint all Nix files with statix and deadnix"
run = ["nix develop -c statix check .", "nix develop -c deadnix ."]

[tasks.lint-md]
description = "Lint all Markdown files"
run = "markdownlint-cli2 '**/*.md' '.claude/**/*.md'"

[tasks.lint-sh]
description = "Lint all shell scripts"
run = "shellcheck scripts/*.sh && shfmt -d scripts/*.sh"

[tasks.lint-toml]
description = "Lint all TOML files"
run = "taplo check"

[tasks.lint-yaml]
description = "Lint all YAML files"
run = "nix develop -c yamllint ."

[tasks.lint-pkl]
description = "Lint all Pkl files"
run = "hk validate"

[tasks.lint-zizmor]
description = "Audit GitHub Actions workflows for security issues"
run = "zizmor .github"

[tasks.lint-all]
description = "Run all linters"
depends = [
  "flake-check",
  "validate-tools",
  "fmt-check",
  "lint",
  "lint-md",
  "lint-sh",
  "lint-toml",
  "lint-yaml",
  "lint-pkl",
  "lint-zizmor",
]

[tasks.flake-update]
description = "Update all flake inputs"
run = "nix flake update"

[tasks.readme-vars]
description = "Regenerate the environment variables section in README.md"
run = "bash scripts/readme-vars.sh"
