[settings]
lockfile = true

[tools]
hk = "1.54.0"
markdownlint-cli2 = "0.23.2"
pkl = "0.32.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
zizmor = "1.28.0"

# nixfmt, statix and deadnix have no mise backend, so the flake devShell pins them.

[tasks.flake-check]
description = "Validate the flake and all tool definitions"
run = "nix flake check"

# `nix flake check` leaves validateAll unchecked, and it is the only thing that
# validates the _-prefixed exclusions.
[tasks.validate-tools]
description = "Validate every tool definition, including _-prefixed exclusions"
run = "nix eval .#validateAll > /dev/null"

# nixfmt deprecated passing a directory, so feed it an explicit file list.
[tasks.fmt]
description = "Format all Nix files"
run = '''nix develop -c bash -c "git ls-files '*.nix' | xargs nixfmt"'''

[tasks.fmt-check]
description = "Check all Nix files are formatted"
run = '''nix develop -c bash -c "git ls-files '*.nix' | xargs nixfmt --check"'''

[tasks.lint]
description = "Lint all Nix files with statix and deadnix"
run = ["nix develop -c statix check .", "nix develop -c deadnix ."]

[tasks.lint-md]
description = "Lint all Markdown files"
run = "markdownlint-cli2 '**/*.md' '.claude/**/*.md'"

# Enumerated rather than globbed so gitignored trees stay out: **/*.sh would
# descend into result/ and .direnv/. -r stops xargs running the linter bare.
[tasks.lint-sh]
description = "Lint all shell scripts"
run = [
  "git ls-files '*.sh' | xargs -r shellcheck",
  "git ls-files '*.sh' | xargs -r shfmt -d",
]

[tasks.lint-toml]
description = "Lint all TOML files"
run = "taplo check"

[tasks.lint-yaml]
description = "Lint all YAML files"
run = "nix develop -c yamllint ."

[tasks.lint-pkl]
description = "Lint all Pkl files"
run = "hk validate"

[tasks.lint-zizmor]
description = "Audit GitHub Actions workflows for security issues"
run = "zizmor .github"

[tasks.lint-all]
description = "Run all linters"
depends = [
  "flake-check",
  "validate-tools",
  "fmt-check",
  "lint",
  "lint-md",
  "lint-sh",
  "lint-toml",
  "lint-yaml",
  "lint-pkl",
  "lint-zizmor",
]

[tasks.flake-update]
description = "Update all flake inputs"
run = "nix flake update"

# jq comes from the flake devShell, so this wraps itself like the nixfmt tasks.
[tasks.readme-tables]
description = "Regenerate the opt-out tables in README.md"
run = "nix develop -c bash scripts/readme-tables.sh"
